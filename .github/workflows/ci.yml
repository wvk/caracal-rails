name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # caracal 2 requires Ruby >= 3.2. Each Rails version runs on one
        # Ruby, so the pairs cover Ruby 3.2 to 4.0 and Rails 7.1 to 8.1.
        include:
          - { ruby: '3.2', rails: '~> 7.1.0' }
          - { ruby: '3.2', rails: '~> 7.2.0' }
          - { ruby: '3.3', rails: '~> 8.0.0' }
          - { ruby: '3.4', rails: '~> 8.1.0' }
          - { ruby: '4.0', rails: '~> 8.1.0' }
    env:
      RAILS_VERSION: ${{ matrix.rails }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec
